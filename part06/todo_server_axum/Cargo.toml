[package]
name = "todo_server_axum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "parking_lot", "rt-multi-thread"] }
